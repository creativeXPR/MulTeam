<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>MulTeam</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <!-- Monaco's own stylesheet, extracted by esbuild from its ESM build (see build/bundle.js). -->
    <link rel="stylesheet" href="js/dist/app.css" />
  </head>
  <body>
    <div class="workspace">
      <div class="top-strip">
        <button class="icon-text-btn" id="back-to-dashboard-btn">
          <span class="btn-icon" id="back-icon"></span>
          Dashboard
        </button>

        <div class="file-menu">
          <button class="icon-text-btn" id="file-menu-btn">
            File
            <span class="btn-icon" id="file-menu-chevron"></span>
          </button>
          <div class="file-menu-dropdown" id="file-menu-dropdown" hidden>
            <button type="button" data-action="new-file"><span class="btn-icon" id="menu-icon-new-file"></span>New File</button>
            <button type="button" data-action="new-folder"><span class="btn-icon" id="menu-icon-new-folder"></span>New Folder</button>
            <div class="menu-divider"></div>
            <button type="button" data-action="save"><span class="btn-icon" id="menu-icon-save"></span>Save</button>
            <button type="button" data-action="save-as"><span class="btn-icon" id="menu-icon-save-as"></span>Save As…</button>
            <button type="button" data-action="rename"><span class="btn-icon" id="menu-icon-rename"></span>Rename</button>
            <button type="button" data-action="duplicate"><span class="btn-icon" id="menu-icon-duplicate"></span>Duplicate</button>
            <div class="menu-divider"></div>
            <button type="button" data-action="delete" class="danger"><span class="btn-icon" id="menu-icon-delete"></span>Delete</button>
          </div>
        </div>

        <span class="project-name" id="project-name-label"></span>
      </div>

      <div id="sidebar" class="sidebar">
        <div class="sidebar-toolbar">
          <span class="sidebar-title">Explorer</span>
          <div class="sidebar-toolbar-actions">
            <button class="icon-only-btn" id="new-file-btn" title="New File"></button>
            <button class="icon-only-btn" id="new-folder-btn" title="New Folder"></button>
          </div>
        </div>
        <div id="file-tree" class="file-tree"></div>
      </div>

      <div class="editor-area">
        <div id="tab-bar" class="tab-bar"></div>
        <div id="monaco-container"></div>
      </div>

      <div class="editor-footer">
        <div id="presence-list" class="presence-list"></div>
        <div class="file-meta">
          <span id="line-count">—</span>
          <span id="char-count">—</span>
          <span class="status-bar">
            <span id="status-dot" class="status-dot"></span>
            <span>Local sync</span>
          </span>
        </div>
      </div>
    </div>

    <!-- Floating right-click context menu for file-tree entries -->
    <div class="context-menu" id="context-menu" hidden></div>

    <div class="modal-overlay" id="rename-modal" hidden>
      <form class="modal-card" id="rename-form">
        <h2>Rename</h2>
        <div class="field">
          <label for="rename-input">New name</label>
          <input id="rename-input" type="text" required autofocus />
        </div>
        <p class="error-text" id="rename-error"></p>
        <div class="modal-actions">
          <button type="button" class="secondary" id="rename-cancel">Cancel</button>
          <button type="submit" class="primary">Rename</button>
        </div>
      </form>
    </div>

    <script type="module" src="js/dist/app.js"></script>
  </body>
</html>
